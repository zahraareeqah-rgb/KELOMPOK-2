<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Anggota - SMKN 1 Garut</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Overlay gelap transparan 50% + background gambar full layar */
            background: linear-gradient(rgba(15, 23, 42, 0.55), rgba(15, 23, 42, 0.55)),
                        url('kelas.jpg') no-repeat center 35% fixed;
            background-size: cover;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            background-color: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            text-decoration: none;
        }

        .navbar ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        .navbar ul li a {
            text-decoration: none;
            color: #cbd5e1;
            font-weight: 500;
            font-size: 0.95rem;
            padding-bottom: 5px;
            transition: all 0.3s ease;
        }

        .navbar ul li a:hover,
        .navbar ul li a.active {
            color: #38bdf8;
            border-bottom: 2px solid #38bdf8;
            font-weight: 600;
        }

        /* ===== MAIN CONTAINER (GLASS BOX) ===== */
        .container {
            max-width: 1050px;
            width: 90%;
            margin: 40px auto;
            padding: 40px 30px;
            flex: 1;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header h1 {
            font-size: 2.3rem;
            color: #ffffff;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        header p {
            color: #94a3b8;
            font-size: 0.98rem;
            font-weight: 400;
        }

        /* ===== TEAM GRID ===== */
        .team-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .member-card {
            border-radius: 20px;
            padding: 30px 15px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* VARIASI GRADIENT MODERN SORE / CYBER */
        .card-blue-1 {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.8), rgba(3, 105, 161, 0.8));
        }

        .card-blue-2 {
            background: linear-gradient(135deg, rgba(51, 65, 85, 0.85), rgba(30, 41, 59, 0.85));
        }

        .card-blue-3 {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.8), rgba(14, 116, 144, 0.8));
        }

        .card-blue-4 {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.8), rgba(29, 78, 216, 0.8));
        }

        .member-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(56, 189, 248, 0.25);
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* Lingkaran Avatar */
        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #ffffff;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
            font-weight: 700;
            margin: 0 auto 15px auto;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Badge Role */
        .role {
            display: inline-block;
            padding: 4px 12px;
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            color: #ffffff;
            font-size: 0.7rem;
            font-weight: 600;
            border-radius: 20px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .member-card h3 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ffffff;
        }

        footer {
            background-color: rgba(15, 23, 42, 0.95);
            color: #64748b;
            text-align: center;
            padding: 1.2rem;
            margin-top: auto;
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 768px) {
            .container {
                padding: 25px 15px;
                margin: 20px auto;
            }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="profil.html" class="logo">XI RPL - SMKN 1 Garut</a>
        <ul>
            <li><a href="profil.html">Profil</a></li>
            <li><a href="anggota.html" class="active">Anggota</a></li>
            <li><a href="kontak.html">Kontak</a></li>
        </ul>
    </nav>

    <!-- CONTENT SECTION (GLASS CARD CONTAINER) -->
    <div class="container">
        <header>
            <h1>Tim Kelompok 2</h1>
            <p>Mengenal lebih dekat para pengembang di balik proyek ini</p>
        </header>

        <main class="team-container">
            <div class="member-card card-blue-1">
                <div class="avatar">A</div>
                <span class="role">Project Manager,DEV</span>
                <h3>Areeqah</h3>
            </div>

            <div class="member-card card-blue-2">
                <div class="avatar">A</div>
                <span class="role">Dev Profil </span>
                <h3>Arief</h3>
            </div>

            <div class="member-card card-blue-3">
                <div class="avatar">S</div>
                <span class="role">Dev Anggota </span>
                <h3>Septi</h3>
            </div>

            <div class="member-card card-blue-4">
                <div class="avatar">N</div>
                <span class="role">Anggota</span>
                <h3>Nessa</h3>
            </div>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 XI RPL - SMKN 1 Garut. All rights reserved.</p>
    </footer>

</body>
</html>
